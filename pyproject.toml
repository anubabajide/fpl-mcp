[project]
name = "fantasy-premier-league-mcp"
version = "0.3.1"
description = "MCP server for Fantasy Premier League, usable by any MCP-capable agent"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Anuba Bajide" }]
keywords = ["fpl", "fantasy-premier-league", "mcp", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "filelock>=3.15,<4",
    "httpx>=0.27,<1",
    "mcp>=2.0.0,<3",
    "playwright>=1.50,<2",
    "uvicorn>=0.30,<1",
]

[project.urls]
Homepage = "https://github.com/anubabajide/fpl-mcp"
Repository = "https://github.com/anubabajide/fpl-mcp"
Issues = "https://github.com/anubabajide/fpl-mcp/issues"

[project.scripts]
fpl-mcp = "fpl_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fpl_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.0,<9"]
