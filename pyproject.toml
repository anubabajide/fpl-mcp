[project]
name = "fpl-mcp"
version = "0.1.0"
description = "MCP server for managing a Fantasy Premier League team"
requires-python = ">=3.10"
dependencies = ["mcp>=2.0.0", "httpx>=0.27"]

[project.scripts]
fpl-mcp = "fpl_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
