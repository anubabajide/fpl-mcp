name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Verify the release version matches the tag
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          with open("pyproject.toml", "rb") as f:
              package_version = tomllib.load(f)["project"]["version"]
          with open("server.json", encoding="utf-8") as f:
              registry_version = json.load(f)["version"]

          if {tag, package_version, registry_version} != {tag}:
              raise SystemExit(
                  f"Tag ({tag}), package ({package_version}), and registry "
                  f"({registry_version}) versions must match."
              )
          PY

      - run: uv sync --frozen --group dev
      - run: uv run pytest -q
      - run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Install the official MCP publisher
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher

      - name: Publish the server metadata
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
